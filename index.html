<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>NOVA — Shop the Future</title>
<meta name="description" content="NOVA is a considered marketplace for objects that earn their place. Curated electronics, fashion, audio and home goods — free shipping over $50, 30-day returns.">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B0B0F" media="(prefers-color-scheme: dark)">

<meta property="og:title" content="NOVA — Shop the Future">
<meta property="og:description" content="Discover products designed for the way you live.">
<meta property="og:type" content="website">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://images.unsplash.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">

<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/layout.css">
<link rel="stylesheet" href="assets/css/pages.css">

<script>
  /* Theme bootstrap — applied before first paint to avoid a flash */
  (function () {
    try {
      var raw = localStorage.getItem('nova.theme');
      var t = raw ? JSON.parse(raw) : null;
      if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
    } catch (e) { }
  })();
</script>

<style>
  /* Critical shell CSS */
  html { scroll-behavior: smooth; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
  #view { display: block; min-height: 62vh; }
  .skip {
    position: fixed; top: 8px; left: 8px; z-index: 999;
    transform: translateY(-200%);
    background: var(--text, #111); color: var(--bg, #fff);
    padding: 10px 16px; border-radius: 10px; font-size: 13px; font-weight: 600;
    transition: transform .2s var(--ease, cubic-bezier(.2,.7,.3,1));
  }
  .skip:focus { transform: none; }
  .boot {
    display: flex; align-items: center; justify-content: center;
    min-height: 60vh; color: var(--text-muted, #666); font-size: 14px; gap: 10px;
  }
  noscript .ns {
    max-width: 560px; margin: 18vh auto; padding: 32px; text-align: center;
    border: 1px solid var(--border, #e5e5e5); border-radius: 18px;
  }
</style>
</head>

<body>
<a class="skip" href="#view">Skip to content</a>

<div class="announce" id="announce" role="status" aria-live="polite"></div>

<header class="navbar" id="navbar"></header>

<main id="view" class="view" tabindex="-1">
  <div class="boot"><span class="spinner"></span>Loading NOVA…</div>
</main>

<footer class="footer" id="footer"></footer>

<!-- Mobile bottom navigation -->
<nav class="bnav" id="bnav" aria-label="Primary mobile"></nav>

<!-- Mobile slide-in menu -->
<aside class="mmenu" id="mmenu" aria-label="Menu"></aside>

<!-- Search overlay -->
<div class="search-overlay" id="searchOverlay" role="dialog" aria-modal="true" aria-label="Search"></div>

<!-- Cart drawer -->
<aside class="drawer right" id="cartDrawer" role="dialog" aria-modal="true" aria-label="Shopping cart"></aside>

<!-- Notifications drawer -->
<aside class="drawer right" id="notifDrawer" role="dialog" aria-modal="true" aria-label="Notifications"></aside>

<noscript>
  <div class="ns">
    <h2 style="margin-bottom:8px">JavaScript is required</h2>
    <p style="color:#666;font-size:14px">NOVA is an interactive storefront. Please enable JavaScript in your browser to browse, filter and check out.</p>
  </div>
</noscript>

<script src="assets/js/icons.js"></script>
<script src="assets/js/core.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/pages-home.js"></script>
<script src="assets/js/pages-shop.js"></script>
<script src="assets/js/pages-product.js"></script>
<script src="assets/js/pages-account.js"></script>
<script src="assets/js/pages-misc.js"></script>
<script src="assets/js/checkout.js"></script>
<script src="assets/js/admin.js"></script>
<script src="assets/js/assistant.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
